<style>
:root{--tx:#fff;--mu:rgba(255,255,255,.58);--ln:rgba(255,255,255,.1);--ok:#30d158;--wr:#ffd60a;--bd:#ff453a;--ac:#fff;--gl:linear-gradient(155deg,rgba(255,255,255,.1) 0%,rgba(255,255,255,.03) 40%,rgba(255,255,255,.05) 100%);--wh:linear-gradient(180deg,#fff 0%,#d6d6dc 100%);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.rc summary{cursor:pointer;margin-top:14px;color:var(--mu);font-size:14px}
.tick{width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3);display:grid;place-items:center;font-size:13px;flex:none;transition:background .2s}
.tick.on{background:var(--wh);color:#000;border-color:#fff}
@keyframes shine{from{transform:translateX(-70%)}to{transform:translateX(70%)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes inr{from{opacity:0;transform:translateX(44px)}to{opacity:1;transform:none}}
@keyframes inl{from{opacity:0;transform:translateX(-44px)}to{opacity:1;transform:none}}

.in-r{animation:inr .38s cubic-bezier(.2,.8,.2,1) both}
.in-l{animation:inl .38s cubic-bezier(.2,.8,.2,1) both}
.in-r>*,.in-l>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.in-r>*:nth-child(2),.in-l>*:nth-child(2){animation-delay:.05s}
.in-r>*:nth-child(3),.in-l>*:nth-child(3){animation-delay:.1s}
.in-r>*:nth-child(4),.in-l>*:nth-child(4){animation-delay:.15s}
.in-r>*:nth-child(n+5),.in-l>*:nth-child(n+5){animation-delay:.2s}
.sheet.up{animation:up .35s cubic-bezier(.2,.8,.2,1) both}
.msg{padding:11px 15px;border-radius:20px;margin:8px 0;max-width:88%;white-space:pre-wrap;line-height:1.45}

.ins{padding:16px 18px;margin-bottom:12px}.ins b{display:block;font-weight:500;margin-bottom:4px}.ins p{margin:0}
button,.chip,.pad button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
</style>

 const contents=msgs.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]}));
 if(o.images&&o.images.length){const l=contents[contents.length-1];const im=await Promise.all(o.images.map(async b=>({inline_data:{mime_type:"image/jpeg",data:await b64(b)}})));l.parts=[...im,...l.parts]}
 const model=o.modelTier==="quick"?"gemini-2.5-flash-lite":"gemini-2.5-flash";
 const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+model+":generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify({contents,generationConfig:{temperature:0.2,maxOutputTokens:2000}})});
 if(r.status===429)throw{code:"rate_limited"};
 if(!r.ok)throw{code:"error",message:"Gemini respondió "+r.status};
 const j=await r.json();const text=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||"").join("");

const K="finanzas_v1";
const CATS=["Comida","Transporte","Casa","Ocio","Salud","Otros"];
let S=null;
try{S=JSON.parse(localStorage.getItem(K)||"null")}catch(e){S=null}
let tab="home",sheet=null,amt="",cat="Comida",merchant="",detail=null,ty="g",gid=null,eid=null,rid=null;
if(S&&!S.goals)S.goals=[];
if(S&&!S.rec)S.rec=[];
if(S&&!S.acc)S.acc=[];
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S));return true}catch(e){return false}};
const fmt=c=>new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN"}).format(c/100);
const toC=s=>Math.round((parseFloat(s)||0)*100);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const dayStart=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
const TY=[["g","Gasto"],["i","Ingreso"],["r","Reembolso"],["t","Traspaso"]];
const TN={g:"Gasto",i:"Ingreso",r:"Reembolso",t:"Traspaso"};
const sg=t=>t.type==="t"?"":(t.type==="i"||t.type==="r")?"+":"−";

function calc(st,at){
  st=st||S;
  const now=at||new Date();
  const dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const daysLeft=dim-now.getDate()+1;
  const mStart=new Date(now.getFullYear(),now.getMonth(),1).getTime();
  const tStart=dayStart(now);
  let extra=0,before=0,today=0;
  for(const t of st.tx){
    if(t.ts<mStart)continue;
    const ty=t.type||"g";
    if(ty==="t")continue;
    if(ty==="i"){extra+=t.amt;continue}
    const v=ty==="r"?-t.amt:t.amt;
    if(t.ts>=tStart)today+=v;else before+=v;
  }
  const fx=Math.max(st.fixed,(st.rec||[]).reduce((a,r)=>a+r.amt,0));
  const disc=Math.max(0,st.income+extra-fx-st.savings);
  const avail=disc-before;
  const daily=Math.max(0,Math.floor(avail/daysLeft));
  const left=daily-today;
  const pct=daily>0?Math.max(0,today/daily):(today>0?Infinity:0);
  const monthSpent=before+today;
  return{fx,extra,disc,dim,daysLeft,before,today,avail,daily,left,pct,monthSpent,monthLeft:disc-monthSpent};
}

function status(p){
  if(p>1)return{c:"var(--bd)",t:"Superaste lo recomendado hoy"};

}

function gaugeHtml(){
  const L=Math.PI*90;

  for(let i=0;i<=10;i++){
    const a=Math.PI*(1-i/10);
    const x1=100+76*Math.cos(a),y1=100-76*Math.sin(a),x2=100+82*Math.cos(a),y2=100-82*Math.sin(a);
    ticks+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="rgba(255,255,255,.35)" stroke-width="1.5" stroke-linecap="round"/>`;
  }
  return `<div class="gauge"><svg viewBox="0 0 200 112"><path d="M10 100 A90 90 0 0 1 190 100" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="12" stroke-linecap="round"/><path id="gf" d="M10 100 A90 90 0 0 1 190 100" fill="none" stroke="#30d158" stroke-width="12" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L}"/>${ticks}<g id="gn" transform="rotate(-90 100 100)"><line x1="100" y1="100" x2="100" y2="40" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><circle cx="100" cy="100" r="7" fill="#fff"/></svg><div class="big" id="gt">${fmt(0)}</div><div class="st" id="gs"></div></div>`;
}

function animateGauge(m){

  if(!gf)return;
  const L=Math.PI*90,real=isFinite(m.pct)?m.pct:2,t0=performance.now(),dur=1400,today=Math.max(0,m.today);
  const step=now=>{
    if(!document.body.contains(gf))return;
    const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3),p=real*e,f=Math.min(p,1),s=status(p);
    gf.style.strokeDashoffset=L*(1-f);
    gf.style.stroke=s.c;
    gf.style.filter=`drop-shadow(0 0 6px ${s.c})`;
    gn.setAttribute("transform",`rotate(${-90+f*180} 100 100)`);
    gt.textContent=fmt(Math.round(today*e));
    gs.style.color=s.c;
    gs.textContent=s.t+" · "+Math.min(999,Math.round(p*100))+"%";
    if(k<1)requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function adviceView(){

  const ex=S.tx.filter(t=>(t.type||"g")==="g"||t.type==="r");
  const val=t=>t.type==="r"?-t.amt:t.amt;
  const cur={},prev={};
  ex.forEach(t=>{const o=t.ts>=mS?cur:t.ts>=pS?prev:null;if(o)o[t.cat]=(o[t.cat]||0)+val(t)});
  if(!ex.length)return `<div class="hd"><h1>Consejos</h1><p>Se generan con tus movimientos reales.</p></div><div class="empty">Registra algunos gastos y aquí aparecerán patrones y proyecciones.</div>`;

  out.push(["Proyección del mes",`Con tu ritmo actual (${fmt(Math.round(avg))} por día) terminarías el mes con ${fmt(Math.abs(proj))} ${proj>=0?"disponibles de tu dinero libre":"por encima de tu dinero libre"}. Es una estimación, no una certeza.`]);
  const top=Object.entries(cur).sort((a,b)=>b[1]-a[1])[0];
  if(top&&m.monthSpent>0)out.push(["Tu mayor categoría",`${top[0]}: ${fmt(top[1])} este mes, ${Math.round(top[1]/m.monthSpent*100)}% de tus gastos.`]);
  Object.keys(cur).forEach(k=>{if(prev[k]>0&&cur[k]>prev[k]*1.25&&cur[k]-prev[k]>5000)out.push(["Subió "+k,`Llevas ${fmt(cur[k])} este mes contra ${fmt(prev[k])} el mes pasado (+${Math.round((cur[k]/prev[k]-1)*100)}%). El mes actual aún no termina.`])});
  const w=[0,0,0,0,0,0,0],c=[0,0,0,0,0,0,0];ex.forEach(t=>{const d=new Date(t.ts).getDay();w[d]+=val(t);c[d]++});
  const mx=w.indexOf(Math.max(...w));

  const big=ex.filter(t=>t.ts>=mS).sort((a,b)=>b.amt-a.amt)[0];
  if(big)out.push(["Gasto más grande del mes",`${esc(big.merchant||big.cat)}: ${fmt(big.amt)}.`]);
  if((S.rec||[]).length)out.push(["Pagos fijos",`Tienes ${S.rec.length} pagos recurrentes que suman ${fmt(S.rec.reduce((a,r)=>a+r.amt,0))} al mes; ya están reservados y no cuentan como dinero libre.`]);

}

function key(k){
  if(k==="⌫")amt=amt.slice(0,-1);
  else if(k==="."){if(!amt.includes("."))amt=(amt||"0")+"."}
  else{
    const p=amt.split(".");
    if(p[1]!==undefined&&p[1].length>=2)return;
    if(amt.replace(".","").length>=9)return;
    amt+=k;
  }
  const d=document.querySelector(".disp");
  if(d&&(sheet==="add"||sheet==="edit")){d.textContent=amt?"$"+amt:"$0";weigh(d,k);return}
  render();
}
function weigh(el,k){
  try{navigator.vibrate&&navigator.vibrate(k==="⌫"?6:10)}catch(e){}
  if(!el.animate||matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const n=amt.replace(".","").length,del=k==="⌫",num=parseInt(k,10);
  const dir=del?(n%2?1:-1):(isNaN(num)?1:(num%2?1:-1));
  const w=del?.35:1+(isNaN(num)?0:num)/9,tilt=dir*w*(3+Math.min(n,9)*.55);
  el.getAnimations().forEach(a=>a.cancel());
  el.animate([
    {transform:"translateY(-4px) rotate(0deg)",offset:0},
    {transform:`translate(${dir*w*7}px,5px) rotate(${tilt}deg)`,offset:.28},
    {transform:`translate(${-dir*w*2.5}px,0) rotate(${-tilt*.35}deg)`,offset:.6},
    {transform:`translate(${dir*w}px,0) rotate(${tilt*.1}deg)`,offset:.82},
    {transform:"none",offset:1}
  ],{duration:420,easing:"cubic-bezier(.25,.8,.3,1)"});
}

function bindSwipe(){
  let x0=0,y0=0,t0=0,drag=false,lock=null,view=null;
  const idx=()=>TABS.findIndex(t=>t[0]===tab);
  document.addEventListener("pointerdown",e=>{
    if(!S||sheet||detail||!e.target.closest("#app")||e.target.closest("input,textarea"))return;
    x0=e.clientX;y0=e.clientY;t0=e.timeStamp;drag=true;lock=null;view=document.querySelector(".view");
  });
  document.addEventListener("pointermove",e=>{
    if(!drag||!view)return;
    const dx=e.clientX-x0,dy=e.clientY-y0;
    if(lock===null){
      if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
      lock=Math.abs(dx)>Math.abs(dy)*1.3?"h":"v";
      if(lock==="h"){view.className="view";view.style.animation="none"}
    }
    if(lock!=="h")return;
    const i=idx(),edge=(dx>0&&i===0)||(dx<0&&i===TABS.length-1);
    view.style.transition="none";
    view.style.transform=`translateX(${dx*(edge?.25:.7)}px)`;
    view.style.opacity=String(1-Math.min(.5,Math.abs(dx)/500));
  });
  const end=e=>{
    if(!drag)return;
    drag=false;
    if(lock!=="h"||!view)return;
    swiped=true;
    setTimeout(()=>{swiped=false},120);
    const dx=e.clientX-x0,v=Math.abs(dx)/Math.max(1,e.timeStamp-t0),dir=dx<0?1:-1,n=idx()+dir;
    if((Math.abs(dx)>70||v>.5)&&n>=0&&n<TABS.length){
      view.style.transition="transform .18s ease-in,opacity .18s";
      view.style.transform=`translateX(${-dir*120}px)`;
      view.style.opacity="0";
      setTimeout(()=>setTab(TABS[n][0]),170);
    }else{
      view.style.transition="transform .4s cubic-bezier(.2,.9,.25,1.25),opacity .3s";
      view.style.transform="";
      view.style.opacity="";
    }
  };
  document.addEventListener("pointerup",end);
  document.addEventListener("pointercancel",()=>{drag=false});
  document.addEventListener("click",e=>{if(swiped){e.stopPropagation();e.preventDefault();swiped=false}},true);
}

function dateTs(v){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||"");
  if(!m)return Date.now();
  const d=new Date(+m[1],+m[2]-1,+m[3],12);
  if(dayStart(d)===dayStart(new Date()))return Date.now();
  return Math.min(d.getTime(),Date.now());
}

function shrink(file,max,q){
  return new Promise((ok,no)=>{
    const im=new Image(),u=URL.createObjectURL(file);
    im.onload=()=>{
      const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
      c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(u);
      c.toBlob(b=>b?ok({blob:b,url:c.toDataURL("image/jpeg",q)}):no(new Error("img")),"image/jpeg",q);
    };
    im.onerror=()=>no(new Error("img"));
    im.src=u;
  });
}

async function readTicket(inp){
  const f=inp.files&&inp.files[0];
  if(!f)return;
  if(!AI){T.err=NOAI;render();return}
  const my=++T.run;
  T.state="work";T.err="";render();
  try{
    const big=await shrink(f,1600,.8),small=await shrink(f,900,.5);
    const d=await AI.json(PT,{images:[big.blob],modelTier:"default"});
    if(my!==T.run)return;
    T.d=cleanTicket(d);T.img=small.url;

    T.state="review";
  }catch(e){
    if(my!==T.run)return;
    T.state="idle";T.err=e&&e.message==="vacio"?"No pude leer productos ni total en la foto. Intenta con más luz y el ticket completo.":errCopy(e);

}

/* Contrato de un proveedor: pull(cuenta, desde) devuelve [{id,ts,desc,amt,dir:"out"|"in",st:"p"|"s"}]
   con amt en centavos positivos. Todo lo demás (conciliación, duplicados, calendario) es igual para cualquier origen. */
const PROVIDERS={
  archivo:{name:"Estado de cuenta (CSV o texto)",ready:true,desc:"Pegas o cargas el archivo que descargas de tu banco. Funciona hoy y no necesita servidor."},
  agregador:{name:"Agregador bancario",ready:false,desc:"Conexión automática con tu consentimiento, mediante un proveedor como Belvo o Finerio Connect. Tú autorizas en la pantalla del banco; esta app nunca ve tu usuario ni tu contraseña.",needs:["Cuenta con el proveedor y su aprobación para producción.","Un servidor propio que guarde las llaves y reciba los movimientos: las llaves no pueden vivir en esta página.","Confirmar que tu banco esté dentro de la cobertura del proveedor."]}
};
async function pullFrom(a){

/* ---------- lectura de estados de cuenta ---------- */
const MES={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,oct:10,nov:11,dic:12};
function mkDate(y,m,d){
  if(y<100)y+=2000;
  const dt=new Date(y,m-1,d,12);
  return dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===d?dt.getTime():null;
}
function parseDate(s){
  s=String(s==null?"":s).trim().toLowerCase().replace(/\./g,"");
  let m=/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/.exec(s);
  if(m)return mkDate(+m[1],+m[2],+m[3]);
  m=/^(\d{1,2})[-/ ](\d{1,2})[-/ ](\d{2,4})/.exec(s);
  if(m)return mkDate(+m[3],+m[2],+m[1]);
  m=/^(\d{1,2})[-/ ]([a-záéíóú]{3,5})[-/ ,]*(\d{2,4})/.exec(s);
  if(m&&MES[m[2].slice(0,3)])return mkDate(+m[3],MES[m[2].slice(0,3)],+m[1]);
  return null;
}
function parseAmt(s){
  s=String(s==null?"":s).trim();
  if(!s)return null;
  let neg=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
  if(/-\s*$/.test(s)){neg=true;s=s.replace(/-\s*$/,"")}
  if(/^[-−–]/.test(s)){neg=true;s=s.replace(/^[-−–]\s*/,"")}
  s=s.replace(/mxn|mn|\$|\s/gi,"");
  if(!/^\d[\d.,]*$/.test(s))return null;
  const lc=s.lastIndexOf(","),ld=s.lastIndexOf(".");
  if(lc>=0&&ld>=0){s=lc>ld?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"")}
  else if(lc>=0){s=/^\d{1,3}(,\d{3})+$/.test(s)?s.replace(/,/g,""):/,\d{1,2}$/.test(s)?s.replace(",","."):s.replace(/,/g,"")}
  else if(ld>=0&&(s.match(/\./g)||[]).length>1){s=s.replace(/\./g,"")}
  const v=parseFloat(s);
  if(!isFinite(v))return null;
  const c=Math.round(v*100);
  return neg?-c:c;
}
function splitLine(l,d){
  const o=[];let c="",q=false;
  for(let i=0;i<l.length;i++){
    const ch=l[i];
    if(q){if(ch==='"'){if(l[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===d){o.push(c.trim());c=""}
    else c+=ch;
  }
  o.push(c.trim());
  return o;
}
const PEND=/pendiente|pending|por aplicar|en proceso/i;
function parseStatement(text,neg,acc){
  const lines=String(text||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean).slice(0,1500);
  if(!lines.length)return{rows:[],bad:0};
  let d=",",best=0;
  for(const c of [",",";","\t","|"]){const n=splitLine(lines[0],c).length-1;if(n>best){best=n;d=c}}
  let H=null,start=0;
  if(best>0){
    const h=splitLine(lines[0],d).map(x=>x.toLowerCase());
    if(h.some(x=>/fecha|date/.test(x))&&parseDate(h[0])===null){
      const g={};
      h.forEach((x,i)=>{
        if(g.date==null&&/fecha|date/.test(x))g.date=i;
        else if(g.cargo==null&&/cargo|retiro|d[eé]bito|egreso/.test(x))g.cargo=i;
        else if(g.abono==null&&/abono|dep[oó]sito|ingreso|cr[eé]dito/.test(x))g.abono=i;
        else if(g.amt==null&&/monto|importe|amount|cantidad/.test(x))g.amt=i;
        else if(g.st==null&&/estatus|estado|status/.test(x))g.st=i;
        else if(g.id==null&&/^(id|folio|referencia|ref|clave)/.test(x))g.id=i;
        else if(g.desc==null&&/desc|concepto|comercio|detalle|merchant|movimiento|establecimiento/.test(x))g.desc=i;
      });
      if(g.date!=null&&(g.amt!=null||g.cargo!=null||g.abono!=null)){H=g;start=1}
    }
  }
  const raw=[];let bad=0;
  for(let i=start;i<lines.length;i++){
    const L=lines[i];
    let ts=null,desc="",c=null,dir=null,id=null,pend=false;
    if(best>0){
      const cells=splitLine(L,d);
      if(H){
        ts=parseDate(cells[H.date]);
        desc=H.desc!=null?(cells[H.desc]||""):"";
        pend=H.st!=null?PEND.test(cells[H.st]||""):PEND.test(L);
        if(H.id!=null&&cells[H.id])id=cells[H.id];
        const ca=H.cargo!=null?parseAmt(cells[H.cargo]):null,ab=H.abono!=null?parseAmt(cells[H.abono]):null;
        if(ca){c=Math.abs(ca);dir="out"}
        else if(ab){c=Math.abs(ab);dir="in"}
        else if(H.amt!=null){const v=parseAmt(cells[H.amt]);if(v){c=Math.abs(v);dir=(v<0)===neg?"out":"in"}}
      }else{
        const di=cells.findIndex(x=>parseDate(x)!==null);
        if(di>=0){
          ts=parseDate(cells[di]);
          let bi=-1;
          cells.forEach((x,j)=>{if(j!==di&&parseAmt(x)===null&&parseDate(x)===null&&x.length>(bi>=0?cells[bi].length:0))bi=j});
          desc=bi>=0?cells[bi]:"";
          let ai=-1;
          for(let j=Math.max(bi+1,0);j<cells.length;j++){if(j!==di&&parseAmt(cells[j])!==null){ai=j;break}}
          if(ai<0)for(let j=0;j<cells.length;j++){if(j!==di&&parseAmt(cells[j])!==null){ai=j;break}}
          const v=ai>=0?parseAmt(cells[ai]):null;
          if(v){c=Math.abs(v);dir=(v<0)===neg?"out":"in"}
        }
        pend=PEND.test(L);
      }
    }else{
      const m=/^(\d{1,4}[-/]\d{1,2}[-/]\d{1,4}|\d{1,2} [a-zA-Z]{3,5}\.? \d{2,4})\s+(.+?)\s+(\(?-?\$?\s?[\d.,]+\)?-?)\s*$/.exec(L);
      if(m){
        ts=parseDate(m[1]);desc=m[2];
        const v=parseAmt(m[3]);
        if(v){c=Math.abs(v);dir=(v<0)===neg?"out":"in"}
        pend=PEND.test(L);
      }
    }
    if(ts===null||!c||!dir){bad++;continue}
    raw.push({ts,desc:desc||"Sin descripción",amt:c,dir,st:pend?"p":"s",id});
  }
  return{rows:finalize(raw,acc),bad};
}
function finalize(raw,acc){
  const cnt={};
  return raw.map(r=>{
    const base=r.id?"id:"+acc+"|"+r.id:acc+"|"+ymd(new Date(r.ts))+"|"+toks(r.desc).join("")+"|"+r.amt+"|"+r.dir;
    let ext=base;
    if(!r.id){cnt[base]=(cnt[base]||0)+1;ext=base+"|"+cnt[base]}
    return{ext,ts:r.ts,desc:r.desc,amt:r.amt,dir:r.dir,st:r.st};
  });
}

/* ---------- conciliación ---------- */
const STOP=new Set(["compra","pago","tarjeta","tdc","tdd","mex","del","los","las","con","por","pos","cargo","spei","ref","suc","mxn","tienda","comercio","sucursal","referencia","pesos","sapi"]);
function toks(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").split(" ").filter(w=>w.length>=3&&!/^\d+$/.test(w)&&!STOP.has(w));
}
function mmatch(a,b){
  const x=toks(a),y=toks(b);
  if(!x.length||!y.length)return false;
  if(x.some(w=>y.includes(w)))return true;
  const p=x.join(""),q=y.join("");
  return p.length>=4&&q.length>=4&&(p.includes(q)||q.includes(p));
}
const TRX=/pago\s+(de\s+)?(tarjeta|tdc|tc)\b|traspaso|abono\s+tarjeta|transferencia\s+(propia|entre\s+mis)|spei.*(mi\s+cuenta|propia)|pago\s+a\s+tu\s+tarjeta|pago\s+recibido/i;
const guessType=r=>r.dir==="out"?(TRX.test(r.desc)?"t":"g"):"t";
const CATRX=[
  [/uber\s*eats|didi\s*food|rappi|mcdonald|burger|kfc|domino|starbucks|oxxo|7.?eleven|walmart|soriana|chedraui|costco|aurrera|restaur|cafe|taquer|super|panader/i,"Comida"],
  [/uber|didi|cabify|pemex|gasolin|caseta|metro|estacionamiento|shell/i,"Transporte"],
  [/cfe|telmex|izzi|totalplay|telcel|agua|gas\s*natural|renta|ikea|home\s*depot/i,"Casa"],
  [/netflix|spotify|disney|hbo|cinepolis|cinemex|steam|prime\s*video|youtube|playstation|xbox/i,"Ocio"],
  [/farmacia|guadalajara|benavides|similares|hospital|doctor|clinica|laborat/i,"Salud"]
];
function guessCat(s){
  s=String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"");
  for(const [rx,c] of CATRX)if(rx.test(s))return c;
  return "Otros";
}
function tidy(s){
  s=String(s||"").replace(/\s+/g," ").trim().slice(0,60);
  if(s&&s===s.toUpperCase())s=s.toLowerCase().replace(/(^|\s)\S/g,x=>x.toUpperCase());
  return s;
}
const dd0=(a,b)=>Math.abs(dayStart(new Date(a))-dayStart(new Date(b)))/DAY;
function classify(rows,acc,txs){
  const used=new Set(),byExt={},seen=new Set();
  for(const t of txs)for(const e of (t.exts||[]))byExt[e]=t;
  const dirOf=t=>t.dir||(t.type==="g"?"out":"in");
  return rows.map(r=>{
    const m={r,kind:"new",type:guessType(r),ref:null,link:null};
    const ex=byExt[r.ext];
    if(ex||seen.has(r.ext)){
      if(ex&&ex.st==="p"&&r.st==="s"&&!used.has(ex.id)){used.add(ex.id);m.kind="settle";m.ref=ex.id}
      else m.kind="dup";
      seen.add(r.ext);
      return m;
    }
    seen.add(r.ext);
    if(r.st==="s"){
      const p=txs.find(t=>!used.has(t.id)&&t.src==="banco"&&t.st==="p"&&t.acc===acc&&t.amt===r.amt&&dirOf(t)===r.dir&&dd0(t.ts,r.ts)<=5);
      if(p){used.add(p.id);m.kind="settle";m.ref=p.id;return m}
    }
    let best=null;
    for(const t of txs){
      if(used.has(t.id)||t.exts||t.src==="banco")continue;
      const ty=t.type||"g";
      if(r.dir==="out"?ty!=="g":(ty!=="i"&&ty!=="r"))continue;
      if(t.acc&&t.acc!==acc)continue;
      const dd=dd0(t.ts,r.ts);
      if(dd>3)continue;
      const exact=t.amt===r.amt,near=!exact&&Math.abs(t.amt-r.amt)<=0.1*Math.max(t.amt,r.amt);
      if(!exact&&!near)continue;
      const mm=mmatch(t.merchant,r.desc);
      let lvl=null;
      if(exact&&dd<=1&&mm)lvl="link";
      else if(exact||(near&&dd<=2&&mm))lvl="ask";
      if(!lvl)continue;
      const rank=(lvl==="link"?0:10)+dd+(mm?0:.5)+(exact?0:5);
      if(!best||rank<best.rank)best={t,lvl,rank};
    }
    if(best){used.add(best.t.id);m.kind=best.lvl;m.ref=best.t.id;m.link=best.lvl==="link"?true:null}
    return m;
  });
}
function applyImport(st,acc,ms){
  const c={nuevos:0,vinc:0,liq:0,dup:0},now=Date.now();
  let k=0;
  const find=id=>st.tx.find(x=>x.id===id);
  for(const m of ms){
    const r=m.r;
    if(m.kind==="dup"){c.dup++;continue}
    if(m.kind==="settle"){
      const t=find(m.ref);
      if(t){t.st="s";t.exts=t.exts||[];if(!t.exts.includes(r.ext))t.exts.push(r.ext);c.liq++}
      continue;
    }
    if((m.kind==="link"||m.kind==="ask")&&m.link===true){
      const t=find(m.ref);
      if(t){
        if(t.amt!==r.amt){(t.hist=t.hist||[]).push({amt:t.amt,cat:t.cat,type:t.type||"g",merchant:t.merchant,at:now,why:"banco"});t.amt=r.amt}
        t.acc=acc;t.st=r.st;t.exts=(t.exts||[]).concat(r.ext);t.bank={desc:r.desc};
        c.vinc++;
        continue;
      }
    }
    const ts=dd0(r.ts,now)===0?now:r.ts;
    st.tx.push({id:"t"+now+"b"+(k++),type:m.type,amt:r.amt,cat:guessCat(r.desc),merchant:tidy(r.desc),ts,src:"banco",acc,st:r.st,dir:r.dir,exts:[r.ext],bank:{desc:r.desc}});
    c.nuevos++;
  }
  st.tx.sort((a,b)=>b.ts-a.ts);
  const a=(st.acc||[]).find(x=>x.id===acc);
  if(a)a.last=now;
  return c;
}

const promptBanco=t=>'Hoy es '+ymd(new Date())+'. Extrae los movimientos de este estado de cuenta bancario mexicano y responde SOLO con JSON: {"movs":[{"date":"YYYY-MM-DD","desc":texto tal como aparece,"amount":monto en pesos positivo,"dir":"out" si es cargo o compra|"in" si es abono o depósito,"status":"pending" si dice pendiente o por aplicar|"settled"}]}. Reglas: no inventes movimientos, fechas ni montos; omite saldos, totales y encabezados; si una fila es ilegible, omítela. Texto:\n'+t;

function accSheet(){

function delAcc(){
  S.acc=S.acc.filter(x=>x.id!==aid);

}
async function syncAcc(){
  const a=S.acc.find(x=>x.id===aid);

    const raw=await pullFrom(a);
    IMP={state:"review",acc:a.id,text:"",neg:true,err:"",ms:classify(finalize(raw,a.id),a.id,S.tx),ai:false,busy:false};
    sheet="imp";
  }catch(e){
    if(e&&e.code==="manual"){openImp(a.id);return}
    accMsg=e&&e.code==="not_configured"?"La conexión automática de esta cuenta todavía no está configurada. En «Conectar un banco» ves qué falta.":"No se pudieron traer los movimientos. Intenta de nuevo.";
  }

function connSheet(){

function openImp(id){

}
function closeImp(){IMP.state="idle";IMP.ms=[];IMP.busy=false;sheet=null;render()}
function loadFile(inp){
  const f=inp.files&&inp.files[0];

function analyze(){
  const t=document.getElementById("it");
  if(t)IMP.text=t.value;
  if(!IMP.text.trim()){IMP.err="Pega primero tu estado de cuenta o carga el archivo.";render();return}
  const res=parseStatement(IMP.text,IMP.neg,IMP.acc);
  if(!res.rows.length){IMP.err="No pude leer movimientos con fecha y monto. Revisa el formato o intenta leerlo con IA.";render();return}
  IMP.err=res.bad?res.bad+(res.bad===1?" fila no se pudo leer y se omitió.":" filas no se pudieron leer y se omitieron."):"";
  IMP.ms=classify(res.rows,IMP.acc,S.tx);IMP.ai=false;IMP.state="review";render();
}

function saveImp(){

function impSheet(){
  const head='<div class="sheet"><div><h1>Importar movimientos</h1>';
  const close='<button class="btn sec" onclick="closeImp()">Cancelar</button></div></div>';
  if(!S.acc.length)return head+"<p>Primero crea la cuenta o tarjeta de donde vienen los movimientos.</p><button class=\"btn\" onclick=\"accN='';accI='';afterAcc='imp';sheet='newacc';render()\">Nueva cuenta</button>"+close;
  if(IMP.busy)return head+"<p>Leyendo el texto con IA…</p>"+close;
  const err=IMP.err?`<div class="warn">${esc(IMP.err)}</div>`:"";
  if(IMP.state==="review")return head+reviewHtml(err)+close;
  const accs=S.acc.map(a=>`<button class="chip ${a.id===IMP.acc?"on":""}" onclick="IMP.acc='${a.id}';IMP.neg=${a.kind!=="c"};render()">${esc(a.name)}</button>`).join("");
  const ai=IMP.err&&IMP.text.trim()&&AI?'<button class="btn sec" onclick="aiRead()">Intentar leerlo con IA</button>':"";
  return head+"<p>Pega el estado de cuenta (CSV o texto) o carga el archivo que descargas de tu banco. Solo hacen falta fecha, descripción y monto. Nunca pegues contraseñas.</p><label>Cuenta</label><div class=\"chips\">"+accs+"</div><label>En tu archivo, los cargos aparecen como</label><div class=\"chips\"><button class=\"chip "+(IMP.neg?"on":"")+"\" onclick=\"IMP.neg=true;render()\">Negativos (−)</button><button class=\"chip "+(!IMP.neg?"on":"")+"\" onclick=\"IMP.neg=false;render()\">Positivos (+)</button></div>"+err+`<textarea id="it" style="height:150px;margin-top:16px" placeholder="Fecha,Descripción,Cargo,Abono&#10;20/11/2026,WALMART SUPERCENTER,420.00," oninput="IMP.text=this.value">${esc(IMP.text)}</textarea><div class="btn sec" onclick="document.getElementById('if').click()" style="text-align:center">Cargar archivo CSV o TXT</div><input id="if" type="file" accept=".csv,.txt,text/csv,text/plain" style="display:none" onchange="loadFile(this)"><button class="btn" onclick="analyze()">Revisar movimientos</button>`+ai+close;
}
function reviewHtml(err){
  const ms=IMP.ms;
  const eff=m=>m.kind==="link"||m.kind==="ask"?(m.link===true?"link":m.link===false?"new":"ask"):m.kind;
  const cnt={new:0,link:0,ask:0,settle:0,dup:0};
  ms.forEach(m=>{cnt[eff(m)]++});
  const chip=(l,on,js)=>`<button class="chip ${on?"on":""}" onclick="${js}">${l}</button>`;
  const rows=ms.map((m,i)=>{
    const e=eff(m);
    if(e==="dup")return"";
    const r=m.r,out=r.dir==="out",neu=e!=="new"||m.type==="t";
    const col=neu?"var(--mu)":out?"var(--bd)":"var(--ok)";
    const ref=m.ref&&S.tx.find(x=>x.id===m.ref);
    const w=new Date(r.ts).toLocaleDateString("es-MX",{day:"numeric",month:"short"});
    const refTxt=ref?`«${esc(ref.merchant||ref.cat)}» · ${fmt(ref.amt)} · ${new Date(ref.ts).toLocaleDateString("es-MX",{day:"numeric",month:"short"})}`:"";
    let note="",chips="";
    if(e==="new"){
      chips=out?chip("Gasto",m.type==="g",`setType(${i},'g')`)+chip("Traspaso propio",m.type==="t",`setType(${i},'t')`)
        :chip("Ingreso extra",m.type==="i",`setType(${i},'i')`)+chip("Reembolso",m.type==="r",`setType(${i},'r')`)+chip("Sueldo o traspaso (ya cuenta)",m.type==="t",`setType(${i},'t')`);
      if(!out&&m.type==="t")note='<small style="display:block;margin-top:6px">Si es tu sueldo, déjalo así para no contarlo dos veces.</small>';
    }else if(e==="settle"){
      note=`<small style="display:block;margin-top:6px">Pasa ${refTxt} de Pendiente a Liquidado.</small>`;
    }else{
      note=`<small style="display:block;margin-top:6px;color:${e==="ask"?"var(--wr)":"var(--mu)"}">${e==="ask"?"¿Es el mismo movimiento que ":"Se vincula con "}${refTxt}${e==="ask"?"?":""}</small>`;
      chips=chip("Es el mismo",m.link===true,`setLink(${i},true)`)+chip("Es otro",m.link===false,`setLink(${i},false)`);
    }
    return `<div style="padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.06)"><div style="display:flex;gap:12px;align-items:center"><div class="rm"><b>${esc(r.desc)}</b><small>${w} · ${r.st==="p"?"Pendiente":"Liquidado"}</small></div><div class="amt" style="color:${col}">${out?"−":"+"}${fmt(r.amt)}</div></div>${note}${chips?`<div class="chips" style="justify-content:flex-start;margin-top:10px">${chips}</div>`:""}</div>`;
  }).join("");
  const unres=cnt.ask,n=cnt.new+cnt.link+cnt.settle;
  const label=unres?`Resuelve ${unres} ${unres===1?"duda":"dudas"}`:n?`Guardar ${n} ${n===1?"movimiento":"movimientos"}`:"Listo, nada nuevo";
  return `<p>${cnt.new} nuevos · ${cnt.link} vinculados · ${cnt.settle} por actualizar · ${cnt.dup} ya importados</p><p>Un cargo se vincula solo cuando el monto es igual, la fecha está a máximo un día y el comercio coincide. Si algo no cuadra, te pregunto.</p>${IMP.ai?'<div class="warn">Leído con IA: revisa cada monto antes de guardar.</div>':""}${err}<div class="card lst" style="margin-top:12px">${rows||'<div class="empty">Todo esto ya estaba importado.</div>'}</div><button class="btn" style="${unres?"opacity:.45":""}" onclick="saveImp()">${label}</button><button class="btn sec" onclick="IMP.state='idle';render()">Volver</button>`;
}
